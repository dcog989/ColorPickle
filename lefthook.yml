commit-msg:
  commands:
    conventional:
      run: cog verify --file {1}

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.{rs,toml,lock}"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.{rs,toml,lock}"
      run: cargo clippy --workspace --all-targets -- -D warnings

pre-push:
  commands:
    test:
      run: cargo test --workspace
