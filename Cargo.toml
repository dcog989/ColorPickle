[package]
name = "colorpickle"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Linux screen color picker: pick a pixel or drag-select a region, get the color in any common format, copy it."
readme = "README.md"
repository = "https://github.com/dcog989/ColorPickle"
license = "GPL-3.0-only"
publish = false

[package.metadata.deb]
maintainer = "dcog989 <sirdavidlaws@gmail.com>"
copyright = "2026, dcog989"
license-file = ["LICENSE"]
extended-description = "Pick a pixel or drag-select a region from anywhere on screen and copy the color in any common format."
section = "graphics"
priority = "optional"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libx11-6, libxcursor1, libxi6, libxrandr2, libgl1, libegl1"
recommends = "xdg-desktop-portal"
assets = [
  ["target/release/colorpickle", "usr/bin/", "755"],
  ["packaging/colorpickle.desktop", "usr/share/applications/", "644"],
  ["packaging/colorpickle.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["assets/colorpickle.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/colorpickle", dest = "/usr/bin/colorpickle", mode = "755" },
  { source = "packaging/colorpickle.desktop", dest = "/usr/share/applications/colorpickle.desktop", mode = "644" },
  { source = "packaging/colorpickle.svg", dest = "/usr/share/icons/hicolor/scalable/apps/colorpickle.svg", mode = "644" },
  { source = "assets/colorpickle.png", dest = "/usr/share/icons/hicolor/256x256/apps/colorpickle.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrandr.so.2()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
"xdg-desktop-portal" = "*"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screenshot"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lucide-icons = "1.47.0"
palette = "0.7.7"
pollster = "1.0.1"
rustix = { version = "1", features = ["event", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
x11rb = { version = "0.14", features = ["image", "randr"] }
zbus = "5.19"

[profile.dev.package."*"]
opt-level = 2  # the per-pixel loops in overlay.rs and ext_image.rs are painful at opt-level 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# not panic = "abort": picker.rs detects a dead capture thread via unwinding
