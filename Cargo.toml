[package]
name = "colorpickle"
version = "0.1.0"
edition = "2024"
description = "Linux screen color picker: pick a pixel or drag-select a region, get the color in any common format, copy it."
readme = "README.md"
repository = "https://github.com/dcog989/ColorPickle"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wl-clipboard-rs"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screenshot"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
image = "0.25.10"
palette = "0.7.7"
rustix = { version = "1", features = ["event", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wl-clipboard-rs = "0.9.3"
xcap = { version = "0.9.8", features = ["image"] }
zbus = "5.19"

[package.metadata.deb]
maintainer = "dcog989 <sirdavidlaws@gmail.com>"
copyright = "2026, dcog989"
license-file = ["LICENSE"]
extended-description = "Pick a pixel or drag-select a region from anywhere on screen and copy the colour in any common format."
section = "graphics"
priority = "optional"
depends = "$auto, libxkbcommon0, libwayland-client0, libx11-6, libgl1"
recommends = "xdg-desktop-portal"
assets = [
    ["target/release/colorpickle", "usr/bin/", "755"],
    ["packaging/colorpickle.desktop", "usr/share/applications/", "644"],
    ["packaging/colorpickle.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/colorpickle.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/colorpickle", dest = "/usr/bin/colorpickle", mode = "755" },
    { source = "packaging/colorpickle.desktop", dest = "/usr/share/applications/colorpickle.desktop", mode = "644" },
    { source = "packaging/colorpickle.svg", dest = "/usr/share/icons/hicolor/scalable/apps/colorpickle.svg", mode = "644" },
    { source = "assets/colorpickle.png", dest = "/usr/share/icons/hicolor/256x256/apps/colorpickle.png", mode = "644" },
]
